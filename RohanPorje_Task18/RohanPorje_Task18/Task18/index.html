<!doctype html>
<html>
  <head>
    <title>Greeting Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- header that changes when button is clicked -->
    <h1 id="greeting">Hello</h1>

    <!-- four color boxes -->
    <div class="box" id="redBox">red</div>
    <div class="box" id="blueBox">blue</div>
    <div class="box" id="greenBox">green</div>
    <div class="box" id="yellowBox">yellow</div>

    <!-- input and button for name -->
    <div class="input-area">
      <input type="text" id="nameInput" placeholder="Enter your name" />
      <button id="greetBtn">Greet Me</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
