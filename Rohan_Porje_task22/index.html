<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Project - AI Workspace</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-white text-gray-800">
    <nav class="sticky top-0 z-50 bg-white">
      <div class="max-w-5xl mx-auto px-5 py-3">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-xl">✦ Project</h2>

          <div class="flex items-center gap-5 text-[12px]">
            <a href="#" class="text-gray-500 hover:text-black"> Product </a>

            <a href="#" class="text-gray-500 hover:text-black"> Solutions </a>

            <a href="#" class="text-gray-500 hover:text-black"> Resources </a>

            <a href="#" class="text-gray-500 hover:text-black"> Pricing </a>

            <a href="#" class="font-semibold"> Log in </a>

            <button class="bg-gray-900 text-white px-3 py-2">
              Get AI free
            </button>
          </div>
        </div>
      </div>
    </nav>

    <section class="relative bg-gradient-to-b from-orange-50 to-white">
      <div class="text-center pt-2 pb-16">
        <h1 class="text-3xl md:text-4xl font-bold leading-tight">
          Write, plan, share.
          <br />
          With AI at your side.
        </h1>

        <p class="text-[9px] text-gray-500 mt-3">
          It is the connected workspace where better, faster work happens. Now
          with AI.
        </p>

        <div class="relative mt-4 flex justify-center">
          <button class="bg-gray-900 text-white text-[8px] px-4 py-2">
            Get AI free →
          </button>

          <button
            class="absolute ml-36 bg-blue-600 text-white text-[8px] px-4 py-2"
          >
            Request a demo
          </button>
        </div>

        <div class="relative w-[620px] max-w-full h-[190px] mx-auto mt-7">
          <img
            src="https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=500&q=80"
            alt="Team working on a project"
            class="absolute top-0 left-1/2 -translate-x-1/2 w-[198px] h-[132px] object-cover"
          />

          <div class="absolute left-5 top-9 bg-white px-3 py-2 shadow-md">
            <div class="flex gap-2 items-center">
              <span class="bg-pink-100 p-1 text-[8px]"> 📋 </span>

              <div class="text-left">
                <p class="font-semibold text-[8px]">Tasks</p>

                <p class="text-[6px] text-gray-400">12 tasks completed today</p>
              </div>
            </div>
          </div>

          <div class="absolute right-5 top-4 bg-white px-3 py-2 shadow-md">
            <div class="flex gap-2 items-center">
              <span class="bg-green-100 text-green-500 p-1 text-[8px]">
                ✓
              </span>

              <div class="text-left">
                <p class="font-semibold text-[8px]">Project Status</p>

                <p class="text-[7px] text-green-500 font-semibold">On Track</p>
              </div>
            </div>
          </div>

          <div class="absolute right-10 bottom-2 bg-white px-3 py-2 shadow-md">
            <div class="flex items-center gap-2">
              <div class="flex">
                <img
                  src="https://i.pravatar.cc/30?img=5"
                  alt="Team member"
                  class="w-5 h-5 rounded-full"
                />

                <img
                  src="https://i.pravatar.cc/30?img=8"
                  alt="Team member"
                  class="w-5 h-5 rounded-full -ml-2"
                />

                <img
                  src="https://i.pravatar.cc/30?img=11"
                  alt="Team member"
                  class="w-5 h-5 rounded-full -ml-2"
                />
              </div>

              <div class="text-left">
                <p class="font-semibold text-[7px]">Team Activity</p>

                <p class="text-[6px] text-gray-400">+5 online</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <button
      class="fixed bottom-6 right-6 z-50 w-6 h-6 bg-gray-900 text-white shadow-lg flex items-center justify-center text-[9px]"
    >
      💬
    </button>
  </body>
</html>
