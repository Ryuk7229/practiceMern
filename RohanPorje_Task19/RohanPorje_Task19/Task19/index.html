<!doctype html>
<html>
  <head>
    <title>Service Booking App</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navigation -->
    <nav>
      <div class="logo">Logo</div>

      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#services">Services</a>
        <a href="#">Contact Us</a>
        <a href="#">About Us</a>
      </div>

      <div class="user-area">
        <span>Welcome, Rohan</span>
        <button class="logout">Logout</button>
      </div>
    </nav>

    <div class="main-container">
      <!-- LEFT SECTION -->
      <div class="left-section">
        <h2>Selected Services</h2>

        <div id="cart-items">
          <p id="empty-message">No items have been added yet.</p>
        </div>

        <div class="total">
          <h3>Total Amount</h3>
          <h2>₹<span id="total">0</span></h2>
        </div>

        <!-- BOOKING FORM -->

        <div class="booking-form">
          <h2>Book Now</h2>

          <label>Full Name</label>
          <input type="text" id="name" placeholder="Enter your name" />

          <label>Email</label>
          <input type="email" id="email" placeholder="Enter your email" />

          <label>Password</label>
          <input type="password" id="password" placeholder="Enter password" />

          <button id="book-button">Book Now</button>
        </div>
      </div>

      <!-- RIGHT SECTION -->

      <div class="right-section" id="services">
        <h2>Browse Our Services</h2>

        <p>Choose a service and add it to your booking.</p>

        <!-- ONE SERVICE AT A TIME -->

        <div class="service-card">
          <img id="service-image" src="" alt="Service" />

          <div class="service-info">
            <h2 id="service-name"></h2>

            <p id="service-description"></p>

            <h3>₹<span id="service-price"></span></h3>

            <div class="service-buttons">
              <button id="skip-button">Skip Item</button>

              <button id="add-button">Add Item</button>
            </div>
          </div>
        </div>

        <!-- CART OPTIONS -->

        <div class="cart-options">
          <h3>Add services to your cart</h3>

          <p>Add the service you want and continue to the next service.</p>

          <button id="add-cart">Add to Cart</button>

          <button id="book-now">Book Now</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
