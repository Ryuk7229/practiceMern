<!doctype html>
<html>
  <head>
    <title>Laundry Service Booking</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav>
      <div class="logo">LaundryCare</div>

      <div class="links">
        <a href="#">Home</a>
        <a href="#services">Services</a>
        <a href="#">About Us</a>
        <a href="#">Contact Us</a>
      </div>

      <div class="user">
        <span>Welcome, Rohan</span>
        <button id="logout">Logout</button>
      </div>
    </nav>

    <div class="main">
      <div class="left">
        <h2>Selected Services</h2>

        <div id="cart">
          <p id="empty">No items have been added yet.</p>
        </div>

        <div class="total-box">
          <h3>Total Amount</h3>

          <h2>₹<span id="total">0</span></h2>
        </div>

        <div class="booking">
          <h2>Book Now</h2>

          <label>Full Name</label>
          <input type="text" id="name" placeholder="Enter your name" />

          <label>Email</label>
          <input type="email" id="email" placeholder="Enter your email" />

          <label>Password</label>
          <input type="password" id="password" placeholder="Enter password" />

          <button id="bookingButton">Book Now</button>
        </div>
      </div>

      <div class="right" id="services">
        <h2>Browse Our Services</h2>

        <p>Choose the laundry service you need.</p>

        <div class="service">
          <img id="serviceImage" src="" alt="Laundry Service" />

          <div class="serviceDetails">
            <h2 id="serviceName"></h2>

            <h3>₹<span id="servicePrice"></span></h3>

            <div class="buttons">
              <button id="skipButton">Skip Item</button>

              <button id="addButton">Add Item</button>
            </div>
          </div>
        </div>

        <div class="cartOptions">
          <p>Add the items to the cart and book now.</p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
