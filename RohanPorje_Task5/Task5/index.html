<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="left-section">
        <img
          src="https://static.vecteezy.com/system/resources/previews/055/983/209/non_2x/modern-silver-washing-machine-with-digital-display-and-sleek-design-free-png.png"
          alt="washing machine illustration"
        />
      </div>

      <div class="form-section">
        <div class="form-box">
          <h1>Hello Again!</h1>
          <p>Welcome back! we missed you!</p>

          <form>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Emailid@site.com" />

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Password" />

            <a href="#" class="forgot">Forgot Password</a>

            <button type="submit">Login</button>

            <p class="register">Not a member? <a href="#">Register Now</a></p>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
